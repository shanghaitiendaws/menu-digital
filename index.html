<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>TV 1 - Charcutería Shanghai</title>
  
  <!-- Fuente Lato Heavy -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@900&display=swap" rel="stylesheet">

  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }
    
    html, body { 
      width: 100vw; 
      height: 100vh; 
      overflow: hidden; 
      background-color: #000; 
      font-family: 'Lato', sans-serif;
      font-weight: 900; 
    }
    
    .contenedor-pantalla {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    #bg-video { 
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      object-fit: fill; 
      z-index: 1; 
    }

    .menu-overlay { 
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      z-index: 2; 
      pointer-events: none; 
    }

    /* ESTILO DE PRECIOS - COLOR ROJO Y FUENTE LATO HEAVY */
    .precio { 
      position: absolute; 
      font-family: 'Lato', sans-serif;
      font-size: 1.35vw; 
      font-weight: 900; 
      color: #ac1a12; 
      text-align: right; 
      width: 5vw; 
    }

    /* --- ALINEACIÓN PRECISA DE PRECIOS --- */

    /* JAMONES (Columna izquierda) */
    #p_jamon_1 { top: 22.0%; left: 63.5%; }
    #p_jamon_2 { top: 25.4%; left: 63.5%; }
    #p_jamon_3 { top: 28.8%; left: 63.5%; }
    #p_jamon_4 { top: 32.2%; left: 63.5%; }
    #p_jamon_5 { top: 35.6%; left: 63.5%; }
    #p_jamon_6 { top: 39.0%; left: 63.5%; }
    #p_jamon_7 { top: 42.4%; left: 63.5%; }
    #p_jamon_8 { top: 45.8%; left: 63.5%; }
    #p_jamon_9 { top: 49.2%; left: 63.5%; }

    /* PECHUGAS (Columna derecha arriba) */
    #p_pechuga_1 { top: 21.0%; left: 94.0%; }
    #p_pechuga_2 { top: 24.4%; left: 94.0%; }
    #p_pechuga_3 { top: 27.8%; left: 94.0%; }
    #p_pechuga_4 { top: 31.2%; left: 94.0%; }
    #p_pechuga_5 { top: 34.6%; left: 94.0%; }

    /* MORTADELAS (Columna derecha abajo) */
    #p_mortadela_1 { top: 52.2%; left: 94.0%; }
    #p_mortadela_2 { top: 55.6%; left: 94.0%; }
    #p_mortadela_3 { top: 59.0%; left: 94.0%; }
    #p_mortadela_4 { top: 62.4%; left: 94.0%; }
    #p_mortadela_5 { top: 65.8%; left: 94.0%; }

    /* --- MARQUESINA --- */
    .marquesina-contenedor {
      position: absolute;
      bottom: 0px;
      left: 0px;
      width: 30vw;     
      height: 3.5vh;     
      overflow: hidden;
      display: flex;
      align-items: center;
      z-index: 10;
    }

    .marquesina-texto {
      display: inline-block;
      white-space: nowrap;
      font-family: 'Lato', sans-serif;
      font-size: 0.85vw;
      font-weight: 900;
      color: #FFFFFF;
      animation: moverMarquesina 14s linear infinite;
    }

    .marquesina-texto span {
      color: #FFC107;
    }

    @keyframes moverMarquesina {
      0%   { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }
  </style>
</head>
<body>

  <div class="contenedor-pantalla">
    <video id="bg-video" autoplay muted loop playsinline preload="auto">
      <source src="plantilla_charcuteria.mp4" type="video/mp4">
    </video>

    <div class="menu-overlay">
      <!-- Jamones -->
      <div id="p_jamon_1" class="precio">--.--</div>
      <div id="p_jamon_2" class="precio">--.--</div>
      <div id="p_jamon_3" class="precio">--.--</div>
      <div id="p_jamon_4" class="precio">--.--</div>
      <div id="p_jamon_5" class="precio">--.--</div>
      <div id="p_jamon_6" class="precio">--.--</div>
      <div id="p_jamon_7" class="precio">--.--</div>
      <div id="p_jamon_8" class="precio">--.--</div>
      <div id="p_jamon_9" class="precio">--.--</div>

      <!-- Pechugas -->
      <div id="p_pechuga_1" class="precio">--.--</div>
      <div id="p_pechuga_2" class="precio">--.--</div>
      <div id="p_pechuga_3" class="precio">--.--</div>
      <div id="p_pechuga_4" class="precio">--.--</div>
      <div id="p_pechuga_5" class="precio">--.--</div>

      <!-- Mortadelas -->
      <div id="p_mortadela_1" class="precio">--.--</div>
      <div id="p_mortadela_2" class="precio">--.--</div>
      <div id="p_mortadela_3" class="precio">--.--</div>
      <div id="p_mortadela_4" class="precio">--.--</div>
      <div id="p_mortadela_5" class="precio">--.--</div>

      <!-- Marquesina Tasa BCV y EURO -->
      <div class="marquesina-contenedor">
        <div class="marquesina-texto">
          TASA BCV DEL DÍA: <span id="tasa-usd">Bs. --.--</span> &nbsp;&nbsp;•&nbsp;&nbsp; EURO: <span id="tasa-eur">Bs. --.--</span> &nbsp;&nbsp;•&nbsp;&nbsp; PANADERÍA Y PASTELERÍA SHANGHAI
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const video = document.getElementById("bg-video");
      if (video) {
        video.play().catch(function(e) { console.log("Autoplay:", e); });
      }
    });

    const SHEET_ID = '1XOAgS8WZn6_WXgBoSv_CmLU0N7NJ2Z-2su2zmxEVJLE';

    // Función auxiliar para parsear líneas de CSV
    function parsearCSVLineas(texto) {
      return texto.split('\n').map(linea => {
        return linea.split(',').map(celda => celda.replace(/^"|"$/g, '').trim());
      });
    }

    async function actualizarPrecios() {
      try {
        const res = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Hoja2`);
        const text = await res.text();
        const filas = parsearCSVLineas(text);

        // Jamones (Filas 3 a 11 en Excel -> índices 2 a 10)
        for (let i = 0; i < 9; i++) {
          let val = parseFloat(filas[i + 2]?.[3]);
          if (!isNaN(val)) {
            document.getElementById(`p_jamon_${i+1}`).innerText = val.toFixed(2);
          }
        }

        // Pechugas (Filas 13 a 17 en Excel -> índices 12 a 16)
        for (let i = 0; i < 5; i++) {
          let val = parseFloat(filas[i + 12]?.[3]);
          if (!isNaN(val)) {
            document.getElementById(`p_pechuga_${i+1}`).innerText = val.toFixed(2);
          }
        }

        // Mortadelas (Filas 24 a 28 en Excel -> índices 23 a 27)
        for (let i = 0; i < 5; i++) {
          let val = parseFloat(filas[i + 23]?.[3]);
          if (!isNaN(val)) {
            document.getElementById(`p_mortadela_${i+1}`).innerText = val.toFixed(2);
          }
        }
      } catch (e) {
        console.error("Error al cargar precios:", e);
      }
    }

    async function actualizarTasas() {
      try {
        const res = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Hoja3`);
        const text = await res.text();
        const filas = parsearCSVLineas(text);

        // Celda B2 -> Dólar (Fila 2 -> índice 1)
        let usd = parseFloat(filas[1]?.[1]);
        // Celda B5 -> Euro (Fila 5 -> índice 4)
        let eur = parseFloat(filas[4]?.[1]);

        if (!isNaN(usd)) {
          document.getElementById('tasa-usd').innerText = `Bs. ${usd.toFixed(2)}`;
        }
        if (!isNaN(eur)) {
          document.getElementById('tasa-eur').innerText = `Bs. ${eur.toFixed(2)}`;
        }
      } catch (e) {
        console.error("Error al cargar tasas:", e);
      }
    }

    // Ejecución inicial y temporizador de 30 segundos
    actualizarPrecios();
    actualizarTasas();
    setInterval(() => {
      actualizarPrecios();
      actualizarTasas();
    }, 30000);
  </script>
</body>
</html>
