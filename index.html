<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>TV 1 - Charcutería Shanghai</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@900&display=swap" rel="stylesheet">

  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }
    
    html, body { 
      width: 100vw; 
      height: 100vh; 
      overflow: hidden; 
      background-color: #000; 
      font-family: 'Lato', sans-serif;
      font-weight: 900; 
    }
    
    .contenedor-pantalla {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    #bg-video { 
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      object-fit: fill; 
      z-index: 1; 
    }

    .menu-overlay { 
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      z-index: 2; 
      pointer-events: none; 
    }

    /* ESTILO DE PRECIOS */
    .precio { 
      position: absolute; 
      font-family: 'Lato', sans-serif;
      font-size: 1.35vw; 
      font-weight: 900; 
      color: #ac1a12; 
      text-align: right; 
      width: 6vw; 
    }

    /* JAMONES */
    #p_jamon_1 { top: 22.0%; left: 50.0%; }
    #p_jamon_2 { top: 25.4%; left: 50.0%; }
    #p_jamon_3 { top: 28.8%; left: 50.0%; }
    #p_jamon_4 { top: 32.2%; left: 50.0%; }
    #p_jamon_5 { top: 35.6%; left: 50.0%; }
    #p_jamon_6 { top: 39.0%; left: 50.0%; }
    #p_jamon_7 { top: 42.4%; left: 50.0%; }
    #p_jamon_8 { top: 45.8%; left: 50.0%; }
    #p_jamon_9 { top: 49.2%; left: 50.0%; }

    /* PECHUGAS */
    #p_pechuga_1 { top: 21.0%; left: 91.5%; }
    #p_pechuga_2 { top: 24.4%; left: 91.5%; }
    #p_pechuga_3 { top: 27.8%; left: 91.5%; }
    #p_pechuga_4 { top: 31.2%; left: 91.5%; }
    #p_pechuga_5 { top: 34.6%; left: 91.5%; }

    /* MORTADELAS */
    #p_mortadela_1 { top: 52.0%; left: 91.5%; }
    #p_mortadela_2 { top: 55.4%; left: 91.5%; }
    #p_mortadela_3 { top: 58.8%; left: 91.5%; }
    #p_mortadela_4 { top: 62.2%; left: 91.5%; }
    #p_mortadela_5 { top: 65.6%; left: 91.5%; }

    /* MARQUESINA */
    .marquesina-contenedor {
      position: absolute;
      bottom: 0px;
      left: 0px;
      width: 32vw;     
      height: 3.5vh;     
      overflow: hidden;
      display: flex;
      align-items: center;
      z-index: 10;
    }

    .marquesina-texto {
      display: inline-block;
      white-space: nowrap;
      font-family: 'Lato', sans-serif;
      font-size: 0.85vw;
      font-weight: 900;
      color: #FFFFFF;
      animation: moverMarquesina 14s linear infinite;
    }

    .marquesina-texto span {
      color: #FFC107;
    }

    @keyframes moverMarquesina {
      0%   { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }
  </style>
</head>
<body>

  <div class="contenedor-pantalla">
    <video id="bg-video" autoplay muted loop playsinline preload="auto">
      <source src="plantilla_charcuteria.mp4" type="video/mp4">
    </video>

    <div class="menu-overlay">
      <!-- Jamones -->
      <div id="p_jamon_1" class="precio">--.--</div>
      <div id="p_jamon_2" class="precio">--.--</div>
      <div id="p_jamon_3" class="precio">--.--</div>
      <div id="p_jamon_4" class="precio">--.--</div>
      <div id="p_jamon_5" class="precio">--.--</div>
      <div id="p_jamon_6" class="precio">--.--</div>
      <div id="p_jamon_7" class="precio">--.--</div>
      <div id="p_jamon_8" class="precio">--.--</div>
      <div id="p_jamon_9" class="precio">--.--</div>

      <!-- Pechugas -->
      <div id="p_pechuga_1" class="precio">--.--</div>
      <div id="p_pechuga_2" class="precio">--.--</div>
      <div id="p_pechuga_3" class="precio">--.--</div>
      <div id="p_pechuga_4" class="precio">--.--</div>
      <div id="p_pechuga_5" class="precio">--.--</div>

      <!-- Mortadelas -->
      <div id="p_mortadela_1" class="precio">--.--</div>
      <div id="p_mortadela_2" class="precio">--.--</div>
      <div id="p_mortadela_3" class="precio">--.--</div>
      <div id="p_mortadela_4" class="precio">--.--</div>
      <div id="p_mortadela_5" class="precio">--.--</div>

      <!-- Marquesina -->
      <div class="marquesina-contenedor">
        <div class="marquesina-texto">
          TASA BCV DEL DÍA: <span id="tasa-usd">Bs. --.--</span> &nbsp;&nbsp;•&nbsp;&nbsp; EURO: <span id="tasa-eur">Bs. --.--</span> &nbsp;&nbsp;•&nbsp;&nbsp; PANADERÍA Y PASTELERÍA SHANGHAI
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const video = document.getElementById("bg-video");
      if (video) {
        video.play().catch(function(e) { console.log("Autoplay:", e); });
      }
    });

    const SHEET_ID = '1XOAgS8WZn6_WXgBoSv_CmLU0N7NJ2Z-2su2zmxEVJLE';

    function obtenerJSON(url) {
      return fetch(url)
        .then(res => res.text())
        .then(texto => {
          // Extrae el JSON puro devolviendo el contenido exacto de Google Viz
          const inicio = texto.indexOf('{');
          const fin = texto.lastIndexOf('}') + 1;
          return JSON.parse(texto.substring(inicio, fin));
        });
    }

    function cargarPrecios() {
      const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=Hoja2`;
      obtenerJSON(url).then(data => {
        const rows = data.table.rows;

        // Jamones
        for (let i = 0; i < 9; i++) {
          let v = rows[i + 2]?.c[3]?.v;
          if (v !== undefined && v !== null) {
            document.getElementById(`p_jamon_${i+1}`).innerText = typeof v === 'number' ? v.toFixed(2) : v;
          }
        }

        // Pechugas
        for (let i = 0; i < 5; i++) {
          let v = rows[i + 12]?.c[3]?.v;
          if (v !== undefined && v !== null) {
            document.getElementById(`p_pechuga_${i+1}`).innerText = typeof v === 'number' ? v.toFixed(2) : v;
          }
        }

        // Mortadelas
        for (let i = 0; i < 5; i++) {
          let v = rows[i + 23]?.c[3]?.v;
          if (v !== undefined && v !== null) {
            document.getElementById(`p_mortadela_${i+1}`).innerText = typeof v === 'number' ? v.toFixed(2) : v;
          }
        }
      }).catch(err => console.log("Error precios:", err));
    }

    function cargarTasas() {
      const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=Hoja3`;
      obtenerJSON(url).then(data => {
        const rows = data.table.rows;

        // Dólar (Fila 2 -> B2)
        let usd = rows[1]?.c[1]?.v || rows[0]?.c[1]?.v;
        // Euro (Fila 5 -> B5)
        let eur = rows[4]?.c[1]?.v || rows[3]?.c[1]?.v;

        if (usd !== undefined) {
          document.getElementById('tasa-usd').innerText = `Bs. ${typeof usd === 'number' ? usd.toFixed(2) : usd}`;
        }
        if (eur !== undefined) {
          document.getElementById('tasa-eur').innerText = `Bs. ${typeof eur === 'number' ? eur.toFixed(2) : eur}`;
        }
      }).catch(err => console.log("Error tasas:", err));
    }

    cargarPrecios();
    cargarTasas();
    setInterval(cargarPrecios, 30000);
    setInterval(cargarTasas, 30000);
  </script>
</body>
</html>
