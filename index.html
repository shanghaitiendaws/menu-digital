<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>TV 1 - Charcutería Shanghai</title>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }
    
    html, body { 
      width: 100vw; 
      height: 100vh; 
      overflow: hidden; 
      background-color: #000; 
      font-family: 'Arial Black', sans-serif; 
    }
    
    .contenedor-pantalla {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    #bg-video { 
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      object-fit: fill; 
      z-index: 1; 
    }

    .menu-overlay { 
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      z-index: 2; 
      pointer-events: none; 
    }

    /* COLOR ROJO PERSONALIZADO Y TAMAÑO */
    .precio { 
      position: absolute; 
      font-size: 1.3vw; 
      font-weight: 900; 
      color: #ac1a12; /* Color solicitado */
      text-align: right; 
      width: 6%; 
    }

    /* --- COORDENADAS REBAJADAS A CADA LÍNEA DE "Ref." --- */

    /* JAMONES */
    #p_jamon_1 { top: 18.5%; left: 58.2%; }
    #p_jamon_2 { top: 21.8%; left: 58.2%; }
    #p_jamon_3 { top: 25.1%; left: 58.2%; }
    #p_jamon_4 { top: 28.5%; left: 58.2%; }
    #p_jamon_5 { top: 31.8%; left: 58.2%; }
    #p_jamon_6 { top: 35.1%; left: 58.2%; }
    #p_jamon_7 { top: 38.5%; left: 58.2%; }
    #p_jamon_8 { top: 41.8%; left: 58.2%; }
    #p_jamon_9 { top: 45.1%; left: 58.2%; }

    /* PECHUGAS */
    #p_pechuga_1 { top: 17.5%; left: 91.0%; }
    #p_pechuga_2 { top: 20.8%; left: 91.0%; }
    #p_pechuga_3 { top: 24.1%; left: 91.0%; }
    #p_pechuga_4 { top: 27.5%; left: 91.0%; }
    #p_pechuga_5 { top: 30.8%; left: 91.0%; }

    /* MORTADELAS */
    #p_mortadela_1 { top: 51.5%; left: 91.0%; }
    #p_mortadela_2 { top: 54.8%; left: 91.0%; }
    #p_mortadela_3 { top: 58.1%; left: 91.0%; }
    #p_mortadela_4 { top: 61.5%; left: 91.0%; }
    #p_mortadela_5 { top: 64.8%; left: 91.0%; }

    /* --- MARQUESINA CENTRADA EN LA FRANJA NEGRA --- */
    .marquesina-contenedor {
      position: absolute;
      bottom: 0.2%;
      left: 0.5%;
      width: 29.5%;     
      height: 4.0%;     
      overflow: hidden;
      display: flex;
      align-items: center;
      z-index: 10;
    }

    .marquesina-texto {
      display: inline-block;
      white-space: nowrap;
      font-family: 'Arial', sans-serif;
      font-size: 1.0vw;
      font-weight: bold;
      color: #FFFFFF;
      animation: moverMarquesina 10s linear infinite;
    }

    .marquesina-texto span {
      color: #FFC107;
    }

    @keyframes moverMarquesina {
      0%   { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }
  </style>
</head>
<body>

  <div class="contenedor-pantalla">
    <video id="bg-video" autoplay muted loop playsinline preload="auto">
      <source src="plantilla_charcuteria.mp4" type="video/mp4">
    </video>

    <div class="menu-overlay">
      <!-- Jamones -->
      <div id="p_jamon_1" class="precio">--.--</div>
      <div id="p_jamon_2" class="precio">--.--</div>
      <div id="p_jamon_3" class="precio">--.--</div>
      <div id="p_jamon_4" class="precio">--.--</div>
      <div id="p_jamon_5" class="precio">--.--</div>
      <div id="p_jamon_6" class="precio">--.--</div>
      <div id="p_jamon_7" class="precio">--.--</div>
      <div id="p_jamon_8" class="precio">--.--</div>
      <div id="p_jamon_9" class="precio">--.--</div>

      <!-- Pechugas -->
      <div id="p_pechuga_1" class="precio">--.--</div>
      <div id="p_pechuga_2" class="precio">--.--</div>
      <div id="p_pechuga_3" class="precio">--.--</div>
      <div id="p_pechuga_4" class="precio">--.--</div>
      <div id="p_pechuga_5" class="precio">--.--</div>

      <!-- Mortadelas -->
      <div id="p_mortadela_1" class="precio">--.--</div>
      <div id="p_mortadela_2" class="precio">--.--</div>
      <div id="p_mortadela_3" class="precio">--.--</div>
      <div id="p_mortadela_4" class="precio">--.--</div>
      <div id="p_mortadela_5" class="precio">--.--</div>

      <!-- Marquesina Tasa BCV -->
      <div class="marquesina-contenedor">
        <div class="marquesina-texto">
          TASA BCV DEL DÍA: <span id="tasa-usd">Bs. --.--</span> &nbsp;&nbsp;•&nbsp;&nbsp; PANADERÍA Y PASTELERÍA SHANGHAI
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const video = document.getElementById("bg-video");
      if (video) {
        video.play().catch(function(e) { console.log("Autoplay:", e); });
      }
    });

    // Pega tu ID de Google Sheets aquí
    const SHEET_ID = '1XOAgS8WZn6_WXgBoSv_CmLU0N7NJ2Z-2su2zmxEVJLE'; 

    const URL_PRECIOS = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Hoja2`;
    const URL_TASAS = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Hoja3`;

    async function actualizarPrecios() {
      if (!SHEET_ID || SHEET_ID.includes('PEGA_AQUI')) return;
      try {
        const res = await fetch(URL_PRECIOS);
        const text = await res.text();
        const json = JSON.parse(text.substr(47).slice(0, -2));
        const rows = json.table.rows;

        // Jamones
        for (let i = 0; i < 9; i++) {
          let val = rows[i + 2]?.c[3]?.v;
          if (val !== undefined && val !== null) {
            document.getElementById(`p_jamon_${i+1}`).innerText = typeof val === 'number' ? val.toFixed(2) : val;
          }
        }

        // Pechugas
        for (let i = 0; i < 5; i++) {
          let val = rows[i + 12]?.c[3]?.v;
          if (val !== undefined && val !== null) {
            document.getElementById(`p_pechuga_${i+1}`).innerText = typeof val === 'number' ? val.toFixed(2) : val;
          }
        }

        // Mortadelas
        for (let i = 0; i < 5; i++) {
          let val = rows[i + 23]?.c[3]?.v;
          if (val !== undefined && val !== null) {
            document.getElementById(`p_mortadela_${i+1}`).innerText = typeof val === 'number' ? val.toFixed(2) : val;
          }
        }
      } catch (e) {
        console.error("Error al obtener precios:", e);
      }
    }

    async function actualizarTasa() {
      if (!SHEET_ID || SHEET_ID.includes('PEGA_AQUI')) return;
      try {
        const res = await fetch(URL_TASAS);
        const text = await res.text();
        const json = JSON.parse(text.substr(47).slice(0, -2));
        const rows = json.table.rows;

        // Intenta obtener la tasa de la celda B2 o B1 o A1
        let tasaUSD = rows[1]?.c[1]?.v || rows[0]?.c[1]?.v || rows[0]?.c[0]?.v || '--.--';
        document.getElementById('tasa-usd').innerText = `Bs. ${typeof tasaUSD === 'number' ? tasaUSD.toFixed(2) : tasaUSD}`;
      } catch (e) {
        console.error("Error al obtener la tasa:", e);
      }
    }

    actualizarPrecios();
    actualizarTasa();
    setInterval(actualizarPrecios, 30000);
    setInterval(actualizarTasa, 30000);
  </script>
</body>
</html>
