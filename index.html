<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>TV 1 - Charcutería Shanghai</title>
  
  <!-- Fuente Lato desde Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@900&display=swap" rel="stylesheet">

  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }
    
    html, body { 
      width: 100vw; 
      height: 100vh; 
      overflow: hidden; 
      background-color: #000; 
      font-family: 'Lato', sans-serif;
      font-weight: 900; 
    }
    
    .contenedor-pantalla {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    #bg-video { 
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      object-fit: fill; 
      z-index: 1; 
    }

    .menu-overlay { 
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      z-index: 2; 
      pointer-events: none; 
    }

    /* ESTILO DE PRECIOS - ROJO #ac1a12 Y LATO HEAVY */
    .precio { 
      position: absolute; 
      font-family: 'Lato', sans-serif;
      font-size: 1.4vw; 
      font-weight: 900; 
      color: #ac1a12; 
      text-align: right; 
      width: 5%; 
    }

    /* --- POSICIONES AJUSTADAS AL LADO DE CADA REF. --- */

    /* JAMONES */
    #p_jamon_1 { top: 22.0%; left: 56.5%; }
    #p_jamon_2 { top: 25.5%; left: 56.5%; }
    #p_jamon_3 { top: 29.2%; left: 56.5%; }
    #p_jamon_4 { top: 32.8%; left: 56.5%; }
    #p_jamon_5 { top: 36.4%; left: 56.5%; }
    #p_jamon_6 { top: 40.0%; left: 56.5%; }
    #p_jamon_7 { top: 43.6%; left: 56.5%; }
    #p_jamon_8 { top: 47.2%; left: 56.5%; }
    #p_jamon_9 { top: 50.8%; left: 56.5%; }

    /* PECHUGAS */
    #p_pechuga_1 { top: 21.6%; left: 92.2%; }
    #p_pechuga_2 { top: 25.2%; left: 92.2%; }
    #p_pechuga_3 { top: 28.8%; left: 92.2%; }
    #p_pechuga_4 { top: 32.4%; left: 92.2%; }
    #p_pechuga_5 { top: 36.0%; left: 92.2%; }

    /* MORTADELAS */
    #p_mortadela_1 { top: 52.4%; left: 92.2%; }
    #p_mortadela_2 { top: 56.0%; left: 92.2%; }
    #p_mortadela_3 { top: 59.6%; left: 92.2%; }
    #p_mortadela_4 { top: 63.2%; left: 92.2%; }
    #p_mortadela_5 { top: 66.8%; left: 92.2%; }

    /* --- MARQUESINA CENTRADA EN LA FRANJA NEGRA/ROJA --- */
    .marquesina-contenedor {
      position: absolute;
      bottom: 0.1%;
      left: 0.2%;
      width: 29.8%;     
      height: 3.8%;     
      overflow: hidden;
      display: flex;
      align-items: center;
      z-index: 10;
    }

    .marquesina-texto {
      display: inline-block;
      white-space: nowrap;
      font-family: 'Lato', sans-serif;
      font-size: 0.9vw;
      font-weight: 900;
      color: #FFFFFF;
      animation: moverMarquesina 14s linear infinite;
    }

    .marquesina-texto span {
      color: #FFC107;
    }

    @keyframes moverMarquesina {
      0%   { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }
  </style>
</head>
<body>

  <div class="contenedor-pantalla">
    <video id="bg-video" autoplay muted loop playsinline preload="auto">
      <source src="plantilla_charcuteria.mp4" type="video/mp4">
    </video>

    <div class="menu-overlay">
      <!-- Jamones -->
      <div id="p_jamon_1" class="precio">--.--</div>
      <div id="p_jamon_2" class="precio">--.--</div>
      <div id="p_jamon_3" class="precio">--.--</div>
      <div id="p_jamon_4" class="precio">--.--</div>
      <div id="p_jamon_5" class="precio">--.--</div>
      <div id="p_jamon_6" class="precio">--.--</div>
      <div id="p_jamon_7" class="precio">--.--</div>
      <div id="p_jamon_8" class="precio">--.--</div>
      <div id="p_jamon_9" class="precio">--.--</div>

      <!-- Pechugas -->
      <div id="p_pechuga_1" class="precio">--.--</div>
      <div id="p_pechuga_2" class="precio">--.--</div>
      <div id="p_pechuga_3" class="precio">--.--</div>
      <div id="p_pechuga_4" class="precio">--.--</div>
      <div id="p_pechuga_5" class="precio">--.--</div>

      <!-- Mortadelas -->
      <div id="p_mortadela_1" class="precio">--.--</div>
      <div id="p_mortadela_2" class="precio">--.--</div>
      <div id="p_mortadela_3" class="precio">--.--</div>
      <div id="p_mortadela_4" class="precio">--.--</div>
      <div id="p_mortadela_5" class="precio">--.--</div>

      <!-- Marquesina Tasa BCV y EURO -->
      <div class="marquesina-contenedor">
        <div class="marquesina-texto">
          TASA BCV DEL DÍA: <span id="tasa-usd">Bs. --.--</span> &nbsp;&nbsp;•&nbsp;&nbsp; EURO: <span id="tasa-eur">Bs. --.--</span> &nbsp;&nbsp;•&nbsp;&nbsp; PANADERÍA Y PASTELERÍA SHANGHAI
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const video = document.getElementById("bg-video");
      if (video) {
        video.play().catch(function(e) { console.log("Autoplay:", e); });
      }
    });

    // ID de tu Google Sheets
    const SHEET_ID = '1XOAgS8WZn6_WXgBoSv_CmLU0N7NJ2Z-2su2zmxEVJLE'; 

    const URL_PRECIOS = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Hoja2`;
    const URL_TASAS = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Hoja3`;

    async function actualizarPrecios() {
      try {
        const res = await fetch(URL_PRECIOS);
        const text = await res.text();
        const json = JSON.parse(text.substr(47).slice(0, -2));
        const rows = json.table.rows;

        // Jamones
        for (let i = 0; i < 9; i++) {
          let val = rows[i + 2]?.c[3]?.v;
          if (val !== undefined && val !== null) {
            document.getElementById(`p_jamon_${i+1}`).innerText = typeof val === 'number' ? val.toFixed(2) : val;
          }
        }

        // Pechugas
        for (let i = 0; i < 5; i++) {
          let val = rows[i + 12]?.c[3]?.v;
          if (val !== undefined && val !== null) {
            document.getElementById(`p_pechuga_${i+1}`).innerText = typeof val === 'number' ? val.toFixed(2) : val;
          }
        }

        // Mortadelas
        for (let i = 0; i < 5; i++) {
          let val = rows[i + 23]?.c[3]?.v;
          if (val !== undefined && val !== null) {
            document.getElementById(`p_mortadela_${i+1}`).innerText = typeof val === 'number' ? val.toFixed(2) : val;
          }
        }
      } catch (e) {
        console.error("Error al obtener precios:", e);
      }
    }

    async function actualizarTasas() {
      try {
        const res = await fetch(URL_TASAS);
        const text = await res.text();
        const json = JSON.parse(text.substr(47).slice(0, -2));
        const rows = json.table.rows;

        // Celda B2 -> Dólar (Fila index 0 o 1)
        let tasaUSD = rows[0]?.c[1]?.v || rows[1]?.c[1]?.v || '--.--';
        // Celda B5 -> Euro (Fila index 3 o 4)
        let tasaEUR = rows[3]?.c[1]?.v || rows[4]?.c[1]?.v || '--.--';

        document.getElementById('tasa-usd').innerText = `Bs. ${typeof tasaUSD === 'number' ? tasaUSD.toFixed(2) : tasaUSD}`;
        document.getElementById('tasa-eur').innerText = `Bs. ${typeof tasaEUR === 'number' ? tasaEUR.toFixed(2) : tasaEUR}`;
      } catch (e) {
        console.error("Error al obtener las tasas:", e);
      }
    }

    actualizarPrecios();
    actualizarTasas();
    setInterval(actualizarPrecios, 30000);
    setInterval(actualizarTasas, 30000);
  </script>
</body>
</html>
