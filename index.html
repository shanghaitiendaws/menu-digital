<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>TV 1 - Charcutería</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body, html { 
      width: 100vw; 
      height: 100vh; 
      overflow: hidden; 
      font-family: 'Arial Black', sans-serif; 
      color: #000; 
      background-color: #000; 
    }
    
    /* Contenedor principal responsive manteniendo aspecto 16:9 de TVs HD/4K */
    .contenedor-pantalla {
      position: relative;
      width: 100vw;
      height: 100vh;
      aspect-ratio: 16 / 9;
      margin: 0 auto;
    }

    /* Video de fondo responsive */
    #bg-video { 
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      object-fit: contain; 
      z-index: 1; 
    }

    /* Capa superior para montos y marquesina */
    .menu-overlay { 
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      z-index: 2; 
      pointer-events: none; 
    }

    /* Estilo base de los precios con fuente en vw (relativa al ancho) */
    .precio { 
      position: absolute; 
      font-size: 1.35vw; 
      font-weight: bold; 
      color: #000; 
      text-align: right; 
      width: 6.2%; 
    }

    /* --- POSICIONAMIENTO EN PORCENTAJES (TV 1) --- */

    /* JAMONES (Columna Central) */
    #p_jamon_1 { top: 14.07%; left: 55.72%; }
    #p_jamon_2 { top: 17.40%; left: 55.72%; }
    #p_jamon_3 { top: 20.74%; left: 55.72%; }
    #p_jamon_4 { top: 24.07%; left: 55.72%; }
    #p_jamon_5 { top: 27.40%; left: 55.72%; }
    #p_jamon_6 { top: 30.74%; left: 55.72%; }
    #p_jamon_7 { top: 34.07%; left: 55.72%; }
    #p_jamon_8 { top: 37.40%; left: 55.72%; }
    #p_jamon_9 { top: 40.74%; left: 55.72%; }

    /* PECHUGAS (Columna Derecha Superior) */
    #p_pechuga_1 { top: 12.96%; left: 89.58%; }
    #p_pechuga_2 { top: 16.29%; left: 89.58%; }
    #p_pechuga_3 { top: 19.62%; left: 89.58%; }
    #p_pechuga_4 { top: 22.96%; left: 89.58%; }
    #p_pechuga_5 { top: 26.29%; left: 89.58%; }

    /* MORTADELAS (Columna Derecha Inferior) */
    #p_mortadela_1 { top: 48.14%; left: 89.58%; }
    #p_mortadela_2 { top: 51.48%; left: 89.58%; }
    #p_mortadela_3 { top: 54.81%; left: 89.58%; }
    #p_mortadela_4 { top: 58.14%; left: 89.58%; }
    #p_mortadela_5 { top: 61.48%; left: 89.58%; }

    /* --- MARQUESINA EN FRAGMA VINOTINTO --- */
    .marquesina-contenedor {
      position: absolute;
      bottom: 0%;
      left: 0%;
      width: 25%;      /* Ocupa exactamente el tramo vinotinto */
      height: 5.5%;    /* Altura proporcional del tramo */
      overflow: hidden;
      display: flex;
      align-items: center;
      z-index: 10;
    }

    .marquesina-texto {
      display: inline-block;
      white-space: nowrap;
      font-family: 'Arial', sans-serif;
      font-size: 1.15vw;
      font-weight: bold;
      color: #FFFFFF;
      animation: moverMarquesina 12s linear infinite;
    }

    .marquesina-texto span {
      color: #FFC107; /* Color amarillo/dorado para resaltar la tasa */
    }

    @keyframes moverMarquesina {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }
  </style>
</head>
<body>

  <div class="contenedor-pantalla">
    <!-- Video de fondo en bucle -->
    <video autoplay muted loop id="bg-video">
      <source src="plantilla_charcuteria.mp4" type="video/mp4">
    </video>

    <!-- Precios y marquesina montados en capas -->
    <div class="menu-overlay">
      <!-- Jamones -->
      <div id="p_jamon_1" class="precio">--.--</div>
      <div id="p_jamon_2" class="precio">--.--</div>
      <div id="p_jamon_3" class="precio">--.--</div>
      <div id="p_jamon_4" class="precio">--.--</div>
      <div id="p_jamon_5" class="precio">--.--</div>
      <div id="p_jamon_6" class="precio">--.--</div>
      <div id="p_jamon_7" class="precio">--.--</div>
      <div id="p_jamon_8" class="precio">--.--</div>
      <div id="p_jamon_9" class="precio">--.--</div>

      <!-- Pechugas -->
      <div id="p_pechuga_1" class="precio">--.--</div>
      <div id="p_pechuga_2" class="precio">--.--</div>
      <div id="p_pechuga_3" class="precio">--.--</div>
      <div id="p_pechuga_4" class="precio">--.--</div>
      <div id="p_pechuga_5" class="precio">--.--</div>

      <!-- Mortadelas -->
      <div id="p_mortadela_1" class="precio">--.--</div>
      <div id="p_mortadela_2" class="precio">--.--</div>
      <div id="p_mortadela_3" class="precio">--.--</div>
      <div id="p_mortadela_4" class="precio">--.--</div>
      <div id="p_mortadela_5" class="precio">--.--</div>

      <!-- Marquesina Tasa BCV (Ubicada en el rectángulo vinotinto) -->
      <div class="marquesina-contenedor">
        <div class="marquesina-texto">
          TASA BCV DEL DÍA: <span id="tasa-usd">Bs. --.--</span> &nbsp;&nbsp;•&nbsp;&nbsp; PANADERÍA Y PASTELERÍA SHANGHAI
        </div>
      </div>
    </div>
  </div>

  <script>
    const SHEET_ID = '1795098953'; 
    const URL_PRECIOS = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Hoja2`;
    const URL_TASAS = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Hoja3`;

    // Cargar Precios desde Hoja2
    async function actualizarPrecios() {
      try {
        const res = await fetch(URL_PRECIOS);
        const text = await res.text();
        const json = JSON.parse(text.substr(47).slice(0, -2));
        const rows = json.table.rows;

        // Jamones (Celdas D3 a D11 -> Índice de fila 2 a 10)
        for (let i = 0; i < 9; i++) {
          let val = rows[i + 2]?.c[3]?.v || '--.--';
          document.getElementById(`p_jamon_${i+1}`).innerText = typeof val === 'number' ? val.toFixed(2) : val;
        }

        // Pechugas (Celdas D13 a D17 -> Índice de fila 12 a 16)
        for (let i = 0; i < 5; i++) {
          let val = rows[i + 12]?.c[3]?.v || '--.--';
          document.getElementById(`p_pechuga_${i+1}`).innerText = typeof val === 'number' ? val.toFixed(2) : val;
        }

        // Mortadelas (Celdas D24 a D28 -> Índice de fila 23 a 27)
        for (let i = 0; i < 5; i++) {
          let val = rows[i + 23]?.c[3]?.v || '--.--';
          document.getElementById(`p_mortadela_${i+1}`).innerText = typeof val === 'number' ? val.toFixed(2) : val;
        }
      } catch (e) { 
        console.error("Error al cargar precios:", e); 
      }
    }

    // Cargar Tasa del Día desde Hoja3 (Celda B2 -> Fila índice 1, Columna índice 1)
    async function actualizarTasa() {
      try {
        const res = await fetch(URL_TASAS);
        const text = await res.text();
        const json = JSON.parse(text.substr(47).slice(0, -2));
        const rows = json.table.rows;

        let tasaUSD = rows[1]?.c[1]?.v || '--.--';
        document.getElementById('tasa-usd').innerText = `Bs. ${typeof tasaUSD === 'number' ? tasaUSD.toFixed(2) : tasaUSD}`;
      } catch (e) { 
        console.error("Error al cargar la tasa:", e); 
      }
    }

    // Ejecución inicial y refresco automático cada 30 segundos
    actualizarPrecios();
    actualizarTasa();
    setInterval(actualizarPrecios, 30000);
    setInterval(actualizarTasa, 30000);
  </script>
</body>
</html>
